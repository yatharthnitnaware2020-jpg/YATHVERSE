<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YATHVERSE | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 20%, #35145e 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #24104c 0%, transparent 35%),
                #080612;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 38px;
            border: 1px solid rgba(174, 111, 255, 0.35);
            border-radius: 22px;
            background: rgba(19, 13, 32, 0.88);
            box-shadow: 0 0 45px rgba(139, 92, 246, 0.18);
            backdrop-filter: blur(15px);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #c084fc;
            text-shadow: 0 0 18px #8b5cf6;
        }

        .tagline {
            text-align: center;
            color: #a99bbd;
            font-size: 12px;
            margin-top: 8px;
            letter-spacing: 1px;
        }

        h2 {
            text-align: center;
            margin: 30px 0 8px;
            font-size: 25px;
        }

        .subtitle {
            text-align: center;
            color: #a99bbd;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            background: #0c0915;
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .tabs button {
            width: 50%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #a99bbd;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .tabs button.active {
            background: linear-gradient(135deg, #8b5cf6, #b56cff);
            color: white;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #d7c9e8;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #34234b;
            border-radius: 9px;
            outline: none;
            background: #0c0915;
            color: white;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #a56bff;
            box-shadow: 0 0 12px rgba(165, 107, 255, 0.2);
        }

        .main-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #8b5cf6, #b56cff);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 22px rgba(139, 92, 246, 0.4);
        }

        .footer {
            text-align: center;
            color: #8f829f;
            font-size: 12px;
            margin-top: 25px;
        }

        .footer span {
            color: #c084fc;
        }

        .back {
            display: block;
            text-align: center;
            color: #bba4d8;
            text-decoration: none;
            font-size: 13px;
            margin-top: 18px;
        }

        .back:hover {
            color: white;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">YATHVERSE</div>
        <div class="tagline">BUILT ON TRUST. DRIVEN BY CREATIVITY.</div>

        <h2 id="heading">Welcome Back</h2>
        <p class="subtitle" id="description">
            Login to explore your creative universe.
        </p>

        <div class="tabs">
            <button class="active" id="loginTab" onclick="showLogin()">
                Login
            </button>

            <button id="signupTab" onclick="showSignup()">
                Sign Up
            </button>
        </div>

        <!-- LOGIN FORM -->

        <form id="loginForm">

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword"
                       placeholder="Enter your password" required>
            </div>

            <button type="submit" class="main-btn">
                LOGIN TO YATHVERSE →
            </button>

        </form>

        <!-- SIGNUP FORM -->

        <form id="signupForm" class="hidden">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signupName"
                       placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="signupEmail"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Create Password</label>
                <input type="password" id="signupPassword"
                       placeholder="At least 8 characters"
                       minlength="8" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword"
                       placeholder="Enter password again"
                       minlength="8" required>
            </div>

            <button type="submit" class="main-btn">
                CREATE ACCOUNT →
            </button>

        </form>

        <div class="footer">
            © 2026 <span>YATHVERSE</span>. All rights reserved.
        </div>

        <a href="index.html" class="back">
            ← Back to Homepage
        </a>

    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const signupForm = document.getElementById("signupForm");

        function showLogin() {
            loginForm.classList.remove("hidden");
            signupForm.classList.add("hidden");

            document.getElementById("heading").textContent =
                "Welcome Back";

            document.getElementById("description").textContent =
                "Login to explore your creative universe.";

            document.getElementById("loginTab").classList.add("active");
            document.getElementById("signupTab").classList.remove("active");
        }

        function showSignup() {
            signupForm.classList.remove("hidden");
            loginForm.classList.add("hidden");

            document.getElementById("heading").textContent =
                "Join YATHVERSE";

            document.getElementById("description").textContent =
                "Create your account and unleash your creativity.";

            document.getElementById("signupTab").classList.add("active");
            document.getElementById("loginTab").classList.remove("active");
        }
        const params = new URLSearchParams(window.location.search);

if (params.get("mode") === "signup") {
    showSignup();
} else {
    showLogin();
}

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();

            alert(
                "Login interface is working! Real account authentication will be connected later."
            );
        });

        signupForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const password =
                document.getElementById("signupPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            alert(
                "Signup interface is working! Secure account creation will be connected later."
            );
        });
    </script>

</body>
</html>
